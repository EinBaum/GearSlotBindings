name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: GearSlotBindings
      - name: Package addon
        run: zip -r "GearSlotBindings-${GITHUB_REF_NAME#v}.zip" GearSlotBindings -x 'GearSlotBindings/.git/*' 'GearSlotBindings/.github/*' 'GearSlotBindings/README.md' 'GearSlotBindings/screenshot.webp'
      - uses: softprops/action-gh-release@v2
        with:
          files: GearSlotBindings-*.zip
          generate_release_notes: true
